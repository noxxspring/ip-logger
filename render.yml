# render.yml

services:
  - type: web
    name: rust-ip-logger
    env: rust
    buildCommand: "cargo build --release"
    startCommand: "cargo run --release"
    plan: free
    branches:
      production: main
      preview: feature/*
    pullRequestPreviews: true
    staticPublishPath: ./target/release
    autoDeploy: true
    envVars:
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        value: ""
